name: Build desktop apps
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies
        run: npm ci
        working-directory: editor
      - name: Build embedded editor
        run: npm run build
        working-directory: editor
      - name: Build desktop solution
        run: dotnet build PaperNote.slnx -c Release
      - name: Test storage and integrations
        run: dotnet run --project tests/PaperNote.Tests -c Release --no-build
      - name: Test Windows native windows and WebView lifecycle
        if: runner.os == 'Windows'
        run: |
          dotnet run --project tests/PaperNote.UiTests -c Release --no-build
          dotnet run --project tests/PaperNote.UiTests -c Release --no-build -- --webview
      - name: Install test browsers
        run: npx playwright install chromium webkit
        working-directory: editor
      - name: Test editor in Chromium and WebKit
        run: npm test -- --reporter=list,html
        working-directory: editor
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Publish macOS app
        if: runner.os == 'macOS'
        run: ./scripts/publish-macos.sh ${{ matrix.rid }}
      - name: Publish Windows app
        if: runner.os == 'Windows'
        run: ./scripts/publish-windows.ps1 -Runtime ${{ matrix.rid }}
        shell: pwsh
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: PaperNote-${{ matrix.rid }}
          path: artifacts/PaperNote-${{ matrix.rid }}.zip
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            editor/playwright-report/
            editor/test-results/
          if-no-files-found: ignore
          retention-days: 7
